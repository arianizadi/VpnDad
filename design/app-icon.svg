<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B7CFF"/>
      <stop offset="0.55" stop-color="#3A3FD6"/>
      <stop offset="1" stop-color="#1B1466"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#9FE8FF" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#7C8CFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7C8CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9E4FF"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>
  <circle cx="512" cy="512" r="470" fill="url(#glow)"/>

  <!-- ripples -->
  <g fill="none" stroke="#FFFFFF">
    <circle cx="512" cy="512" r="330" stroke-opacity="0.16" stroke-width="6"/>
    <circle cx="512" cy="512" r="400" stroke-opacity="0.09" stroke-width="5"/>
    <circle cx="512" cy="512" r="468" stroke-opacity="0.05" stroke-width="4"/>
  </g>

  <!-- power glyph: soft shadow, then the mark -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#0B0A3A" stroke-opacity="0.35" filter="url(#soft)" transform="translate(0 18)">
      <path d="M 374 366 A 214 214 0 1 0 650 366" stroke-width="64"/>
      <path d="M 512 268 V 512" stroke-width="64"/>
    </g>
    <path d="M 374 366 A 214 214 0 1 0 650 366" stroke="url(#glyph)" stroke-width="64"/>
    <rect x="480" y="236" width="64" height="308" rx="32" fill="url(#glyph)" stroke="none"/>
  </g>
</svg>
