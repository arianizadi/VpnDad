<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- VpnDad: a tunnel seen head-on, with the lamp lit at the far end. -->
  <defs>
    <radialGradient id="spill" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC46B" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#FFC46B" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFC46B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FFE3B0"/>
      <stop offset="1" stop-color="#FFC46B"/>
    </radialGradient>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#0B1220"/>
  <circle cx="512" cy="512" r="512" fill="url(#spill)"/>

  <!-- rings bunch up with depth, and brighten toward the lamp -->
  <g fill="none" stroke="#FFC46B">
    <circle cx="512" cy="512" r="446" stroke-opacity="0.20" stroke-width="20"/>
    <circle cx="512" cy="512" r="366" stroke-opacity="0.32" stroke-width="17"/>
    <circle cx="512" cy="512" r="304" stroke-opacity="0.46" stroke-width="14"/>
    <circle cx="512" cy="512" r="256" stroke-opacity="0.62" stroke-width="12"/>
    <circle cx="512" cy="512" r="220" stroke-opacity="0.80" stroke-width="10"/>
  </g>

  <circle cx="512" cy="512" r="150" fill="#FFC46B" opacity="0.75" filter="url(#halo)"/>
  <circle cx="512" cy="512" r="150" fill="url(#lamp)"/>
</svg>
